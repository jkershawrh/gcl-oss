apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: gcl-oss-trustyai
  labels:
    app.kubernetes.io/part-of: gcl-oss-evalhub-qualification
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: webhook-server-cert
spec:
  ports:
    - name: webhook
      port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: trustyai-service-operator
