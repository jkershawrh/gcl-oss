apiVersion: v1
kind: ConfigMap
metadata:
  name: evalhub-provider-gcl-contract-probe
  namespace: gcl-oss-trustyai
  labels:
    trustyai.opendatahub.io/evalhub-provider-type: system
    trustyai.opendatahub.io/evalhub-provider-name: gcl-contract-probe
data:
  gcl_contract_probe.yaml: |
    id: gcl_contract_probe
    name: GCL Contract Probe
    description: Non-model workload used only to qualify the authenticated API contract.
    runtime:
      k8s:
        image: quay.io/evalhub/evalhub@sha256:0b9b9cb7121170eb28d7a723b487282cc6ef3640ec9cf9ff6ba50b1bf04a61a1
        entrypoint:
          - /bin/sh
          - -c
          - sleep 3600
        image_pull_policy: if_not_present
        cpu_request: 10m
        memory_request: 32Mi
        cpu_limit: 100m
        memory_limit: 128Mi
    benchmarks:
      - id: contract_probe
        name: GCL contract probe
        description: Synthetic benchmark for transport, tenancy, provenance, and policy qualification.
        category: integration
        metrics:
          - score
        primary_score:
          metric: score
          lower_is_better: false
        pass_criteria:
          threshold: 0.9
---
apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
  namespace: gcl-oss-trustyai
  labels:
    app.kubernetes.io/part-of: gcl-oss-evalhub-qualification
spec:
  replicas: 1
  tenancy: multi
  database:
    type: sqlite
  providers:
    - gcl-contract-probe
  collections: []
  env:
    - name: LOG_LEVEL
      value: INFO
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcl-oss-qualifier
  namespace: gcl-oss-evalhub
  labels:
    app.kubernetes.io/part-of: gcl-oss-evalhub-qualification
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gcl-oss-evalhub-reader
  namespace: gcl-oss-evalhub
  labels:
    app.kubernetes.io/part-of: gcl-oss-evalhub-qualification
rules:
  - apiGroups:
      - trustyai.opendatahub.io
    resources:
      - evaluations
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gcl-oss-evalhub-reader
  namespace: gcl-oss-evalhub
  labels:
    app.kubernetes.io/part-of: gcl-oss-evalhub-qualification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gcl-oss-evalhub-reader
subjects:
  - kind: ServiceAccount
    name: gcl-oss-qualifier
    namespace: gcl-oss-evalhub
